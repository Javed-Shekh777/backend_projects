<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h1 {
            margin: 20px 0px;
        }

        form {
            max-width: 40%;
            background-color: bisque;
            padding: 20px;
            border-radius: 10px;
        }

        form label {
            margin: 3px 0px;
            display: block;
        }

        input {
            padding: 12px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
            width: 100%;
            margin: 0px 0px 10px 0px;
        }

        button {
            display: flex;
            align-self: center;
            margin: 0 auto;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
            background-color: rgb(203, 18, 190);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Reset Passowrd</h1>

    <form action="" id="save">
        <label for="parameter">Parameter * </label>
        <input type="text" name="parameter" placeholder="Enter username or email ">
        <label for="passowrd">Password * </label>
        <input type="text" name="passowrd" placeholder="Enter Passowrd ">
        <label for="cpassowrd">Confirm Password * </label>
        <input type="text" name="cpassowrd" placeholder="Enter confirm Passowrd ">


        <button type="submit">Reset Passowrd</button>
    </form>



    <script>
         let s = document.querySelector("#save");
        s.addEventListener("submit", (e) => {
            e.preventDefault();
            obj.parameter = s.parameter?.value;
            obj.password = s.passowrd?.value;
            obj.cpassword = s.cpassowrd?.value;
            obj.token = document.URL.split("token=")[1];

            console.log(typeof document.URL.split("token=")[1]);
            console.log(obj);
            handleRequest();
        });

        let obj = {
            parameter: "",
            password: "",
            cpassword: "",
            token: "",
        }

        async function handleRequest() {
            try {
                const response = await fetch("http://localhost:8080/api/v1/user/reset-password", {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(obj)
                });

                const result = await response.json();

                console.log(" response : ", result);

            } catch (error) {
                console.log(" Error : ", error);

            }
        }

    </script>
</body>

</html>
